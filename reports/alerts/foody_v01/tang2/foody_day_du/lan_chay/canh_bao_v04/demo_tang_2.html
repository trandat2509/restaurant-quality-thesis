, người quản lý thì họ trả lời mình rằng: Chương trình của quán là như vậy. Cái ghi trên bảng thì khách hàng nên hiểu là 1 hóa đơn thì được 1 cốc nước miễn phí. Nếu nhóm đi 4 người thì cũng chỉ được 1 cốc miễn phí thôi. Mình giải thích với quản lý là cách viết như trên là ĐÁNH LỪA KHÁCH HÀNG. Nếu như bill của bọn mình là 380k thì bọn mình tách là 3 bill là được 3 cốc nước ngay. Quản lý không nói gì. Sau đó có DỌA mình là: Quán có 1 ĐỘI TRUYỀN THÔNG BÁO CHÍ lớn. Mình thì ko cần đồ phải khuyến mại thêm đâu. Nhưng với cách thức đánh lừa như vậy thì mình ko đồng ý. Còn nói chung là đồ ăn ở quán không ngon như các bạn trên Foody ca ngợi. Mình THỰC SỰ THẤT VỌNG. SẼ KHÔNG QUAY LẠI QUÁN, CHO DÙ LÀ ĐƯỢC DỌA LÀ CẢ MỘT ĐỘI TRUYỀN THÔNG. TRUYỀN THÔNG DÙ TỐT ĐẾN MẤY MÀ KHÔNG RÕ RÀNG, ĐÁNH LẬN THÌ KHÓ MÀ KÉO KHÁCH HÀNG ĐẾN ĐƯỢC. Mình nói rằng: QUÁN LÀM NHƯ VẬY LÀ ĐÁNH LẬN CON ĐEN.\u003c/p>\u003cp>\u003cb>Bằng chứng tay đã xác nhận:\u003c/b> Còn nói chung là đồ ăn ở quán không ngon như các bạn trên Foody ca ngợi\u003c/p>\u003c/details>\u003cdetails>\u003csummary>foody_800507 · 2016-04-13\u003c/summary>\u003cp class='original'>Không gian rộng rãi mát mẻ thoáng đãng. Trích lời bạn Xủy \u0026quot;bún này ngon đấy, đáng giá hơn 30k mà vớ vẩn ở ngoài\u0026quot; xôi cứng quá, mỗi là nhiều thịt sâm dứa ngọt, quá ngọt, ăn xong chờ tan đá uống vẫn ngọt. Không thần thánh như bạn gì quảng cáo -.-\u003c/p>\u003cp>\u003cb>Bằng chứng tay đã xác nhận:\u003c/b> xôi cứng quá, mỗi là nhiều thịt || sâm dứa ngọt, quá ngọt\u003c/p>\u003c/details>\u003cdetails>\u003csummary>foody_806378 · 2016-04-17\u003c/summary>\u003cp class='original'>Ngày nghỉ muốn ăn phá lấu nên đến quán ăn gọi thì nhân viên báo hết, gọi sang canh bún, cũng hết, gọi nước sâm dứa, cũng hết, và bọn mình phải gọi đại 1 món ko thích ăn trong thực đơn vì đã ngồi xuống bàn rồi. Thái độ phục vụ tốt nhưng thế này mất khách quá ạ.\u003c/p>\u003cp>\u003cb>Bằng chứng do mô hình trích:\u003c/b> Ngày nghỉ muốn ăn phá lấu nên đến quán ăn gọi th
